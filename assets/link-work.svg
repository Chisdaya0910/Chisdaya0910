<clipPath id="frame"><rect x="1" y="1" width="1278" height="82" rx="24"/></clipPath><style>
.stars{animation:twinkle 9s ease-in-out infinite}.stars-b{animation:twinkle 13s ease-in-out -5s infinite}.nebula{animation:nebula 19s ease-in-out infinite}.float{animation:float 8s ease-in-out infinite}.rotate{animation:rotate 48s linear infinite;transform-origin:0 0}.counter{animation:rotate 67s linear infinite reverse;transform-origin:0 0}.signal{stroke-dasharray:35 965;animation:signal 11s linear infinite}.signal-b{stroke-dasharray:8 992;animation:signal 17s linear infinite reverse}.windows{animation:windows 10s ease-in-out infinite}.windows-b{animation:windows 14s ease-in-out -6s infinite}.scan{animation:scan 10s ease-in-out infinite}.flight{animation:flight 26s linear infinite}.flight-b{animation:flight 33s linear -11s infinite reverse}.meteor{animation:meteor 19s linear infinite;opacity:0}.meteor-b{animation:meteor 25s linear -12s infinite;opacity:0}.energy{animation:energy 12s ease-in-out infinite}.holo{animation:holo 9s ease-in-out infinite}.edge{stroke-dasharray:90 910;animation:signal 20s linear infinite}.wave{animation:wave 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.shard{animation:shard 13s ease-in-out infinite}.ripple{animation:ripple 16s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.35}50%{opacity:.9}}@keyframes nebula{0%,100%{transform:translate(0,0);opacity:.65}50%{transform:translate(-15px,9px);opacity:.95}}@keyframes float{0%,100%{transform:translateY(4px)}50%{transform:translateY(-8px)}}@keyframes rotate{to{transform:rotate(360deg)}}@keyframes signal{to{stroke-dashoffset:-1000}}@keyframes windows{0%,100%{opacity:.4}50%{opacity:.85}}@keyframes scan{0%,100%{transform:translateY(-50px);opacity:0}25%,65%{opacity:.4}80%{transform:translateY(70px);opacity:0}}@keyframes flight{from{transform:translateX(-330px)}to{transform:translateX(390px)}}@keyframes meteor{0%,70%,100%{opacity:0;transform:translate(0,0)}73%{opacity:.7}83%{opacity:0;transform:translate(-220px,130px)}}@keyframes energy{0%,100%{opacity:.35}50%{opacity:.7}}@keyframes holo{0%,100%{opacity:.55}50%{opacity:.9}}@keyframes wave{0%,100%{transform:scaleY(.7)}50%{transform:scaleY(1.1)}}@keyframes shard{0%,100%{transform:translateY(2px) rotate(-1deg)}50%{transform:translateY(-6px) rotate(1deg)}}@keyframes ripple{0%,100%{opacity:.2}50%{opacity:.45}}
