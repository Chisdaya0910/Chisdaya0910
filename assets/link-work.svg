</style><linearGradient id="btn"><stop stop-color="#1b1736"/><stop offset="1" stop-color="#081424"/></linearGradient><linearGradient id="stroke"><stop stop-color="#5ef9ec"/><stop offset=".5" stop-color="#ce79ff"/><stop offset="1" stop-color="#ff6abe"/></linearGradient></defs><path d="M18 4H325L356 29V66L342 80H34L4 55V18Z" fill="url(#btn)" stroke="url(#stroke)" stroke-opacity=".4"/><path class="edge" pathLength="1000" d="M18 4H325L356 29V66L342 80H34L4 55V18Z" stroke="url(#stroke)" stroke-width="1.6" filter="url(#glow)"/><path d="M15 20v29l21 20m291-56 19 19v28" stroke="#62e9ee" stroke-opacity=".35"/><path d="M39 18h45" stroke="#da87fd" stroke-opacity=".5"/><text x="166" y="48" text-anchor="middle" fill="#cfbaf0" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" letter-spacing="1.2">SELECTED WORK</text><path d="M307 42h14m-6-6 6 6-6 6" stroke="#62f3eb" stroke-width="1.5" filter="url(#glow)"/></svg>