<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="180" viewBox="0 0 1280 180" fill="none" role="img" aria-labelledby="title desc"><title id="title">Let us create something considered</title><desc id="desc">A dark prismatic closing panel with a gently traveling light.</desc><defs><linearGradient id="bg" x2="1280" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#080d1b"/><stop offset=".5" stop-color="#141027"/><stop offset="1" stop-color="#090e20"/></linearGradient><linearGradient id="rim" x1="650" y1="60" x2="1230" y2="450" gradientUnits="userSpaceOnUse"><stop stop-color="#8ae9df"/><stop offset=".48" stop-color="#bda3ff"/><stop offset="1" stop-color="#f3b9d9"/></linearGradient><linearGradient id="silk" x1="600" y1="400" x2="1250" y2="80" gradientUnits="userSpaceOnUse"><stop stop-color="#8ae9df" stop-opacity="0"/><stop offset=".3" stop-color="#8ae9df" stop-opacity=".45"/><stop offset=".58" stop-color="#bda3ff" stop-opacity=".65"/><stop offset=".82" stop-color="#f3b9d9" stop-opacity=".45"/><stop offset="1" stop-color="#f3b9d9" stop-opacity="0"/></linearGradient><radialGradient id="halo"><stop stop-color="#bda3ff" stop-opacity=".22"/><stop offset="1" stop-color="#8ae9df" stop-opacity="0"/></radialGradient><linearGradient id="glass" x1="820" y1="65" x2="1100" y2="400" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset=".14" stop-color="#8ae9df"/><stop offset=".29" stop-color="#f0fff5"/><stop offset=".43" stop-color="#659e94"/><stop offset=".56" stop-color="#bda3ff"/><stop offset=".7" stop-color="#fff7ff"/><stop offset=".87" stop-color="#f3b9d9"/><stop offset="1" stop-color="#569581"/></linearGradient><radialGradient id="pearl" cx=".28" cy=".23"><stop stop-color="#ffffff"/><stop offset=".4" stop-color="#bda3ff"/><stop offset=".83" stop-color="#8ae9df"/><stop offset="1" stop-color="#f3b9d9"/></radialGradient><style>
.float{animation:float 10s ease-in-out infinite}.silk{animation:silk 18s ease-in-out infinite;transform-origin:960px 250px}.ray{stroke-dasharray:44 1156;animation:ray 16s linear infinite}.ray2{stroke-dasharray:12 1188;animation:ray 23s linear infinite reverse}.star{animation:star 7s ease-in-out infinite}.turn{animation:turn 42s linear infinite;transform-origin:0 0}.shimmer{animation:shimmer 12s ease-in-out infinite}.edge{stroke-dasharray:90 910;animation:edge 22s linear infinite}
